<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0099cc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SICRAT">
    <meta name="robots" content="noindex">
    <title>SICRAT · Consultas guardadas</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/assets/pwa/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-180x180-touch-icon.png">
    <link rel="stylesheet" href="/assets/css/pwa.css">
    <script src="/assets/js/pwa/register.js" defer></script>
    <script src="/assets/js/pwa/offline.js" defer></script>
</head>
<body data-offline-shell>
    <main class="pwa-shell">
        <header class="pwa-heading">
            <img src="/assets/pwa/icon-192.png" alt="SICRAT" width="64" height="64">
            <div><h1>Consultas guardadas</h1><p>SICRAT · Solo lectura</p></div>
        </header>
        <section class="pwa-card">
            <h2 id="offline-account">Tu información, en este dispositivo</h2>
            <p id="offline-state" role="status">Verificando el acceso a tus consultas. Si esta sesión ya no está disponible, vuelve a iniciar sesión con conexión.</p>
            <div class="pwa-actions"><a href="/">Volver a SICRAT con conexión</a><a href="/autenticacion/">Iniciar sesión</a></div>
        </section>
        <section id="offline-content" hidden>
            <div class="pwa-filters">
                <label>Módulo <select id="offline-module"><option value="">Todos los módulos</option><option value="personas">Personas</option><option value="estructura">Estructura</option><option value="operaciones">Tareas, peticiones e incidencias</option><option value="jornada">Jornada Electoral</option><option value="mensajes">Mensajes</option></select></label>
                <label>Buscar en lo guardado <input id="offline-search" type="search" placeholder="Nombre o contenido consultado"></label>
            </div>
            <p id="offline-empty" hidden>Esta información no está disponible sin conexión.</p>
            <div id="offline-records"></div>
        </section>
    </main>
</body>
</html>
